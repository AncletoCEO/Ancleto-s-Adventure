name: Export builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -oq godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -oq templates.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Import project
        run: godot --headless --import --path .

      # Linux, Windows, macOS (ad-hoc) y Web se pueden construir desde Linux.
      # Android necesita Android SDK + JDK; iOS necesita macOS + Xcode.
      - name: Export
        run: tools/export_all.sh "Linux" "Windows Desktop" "macOS" "Web"

      - name: Package per-OS
        run: |
          mkdir -p dist
          [ -d build/linux ] && tar czf dist/ancleto-linux.tar.gz -C build linux
          [ -d build/windows ] && tar czf dist/ancleto-windows.tar.gz -C build windows
          [ -d build/web ] && tar czf dist/ancleto-web.tar.gz -C build web
          [ -f build/macos/AncletoAdventure.zip ] && cp build/macos/AncletoAdventure.zip dist/ancleto-macos.zip
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ancleto-builds
          path: build/

      - name: Publish release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
